<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Requisition History – Design 1</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet">
        <style>
            :root {
                --navy: #040D33;
                --card: #fff;
                --border: #dbe4f5;
                --light: #f0f4ff;
                --muted: #6b7fa3;
                --text: #131313;
                --g-total: linear-gradient(135deg, #1a1a6e 0%, #2d4db5 100%);
                --g-pending: linear-gradient(135deg, #b45309 0%, #f59e0b 100%);
                --g-approved: linear-gradient(135deg, #065f46 0%, #10b981 100%);
                --g-rejected: linear-gradient(135deg, #991b1b 0%, #ef4444 100%);
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0
            }

            body {
                font-family: 'Sora', sans-serif;
                background: #f0f4ff;
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column
            }

            .container {
                max-width: 1120px;
                margin: 0 auto;
                padding: 0 24px
            }

            /* NAV */
            nav {
                background: var(--navy);
                padding: 0;
                position: sticky;
                top: 0;
                z-index: 100;
                box-shadow: 0 2px 24px rgba(4, 13, 51, .22)
            }

            .nav-inner {
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 62px
            }

            .nav-brand {
                font-size: 18px;
                font-weight: 800;
                color: #fff;
                letter-spacing: -.02em
            }

            .nav-brand span {
                color: #f59e0b
            }

            .nav-pill {
                background: rgba(245, 158, 11, .15);
                color: #f59e0b;
                border: 1px solid rgba(245, 158, 11, .3);
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                padding: 4px 12px;
                border-radius: 20px;
                letter-spacing: .07em
            }

            .nav-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: linear-gradient(135deg, #f59e0b, #f97316);
                color: #fff;
                font-weight: 700;
                font-size: 13px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 2px solid rgba(255, 255, 255, .2)
            }

            .nav-right {
                display: flex;
                align-items: center;
                gap: 14px
            }

            /* MAIN */
            main {
                flex: 1;
                padding: 40px 0 70px
            }

            /* Summary Cards */
            .summary-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
                margin-bottom: 32px
            }

            .s-card {
                border-radius: 18px;
                padding: 24px 22px;
                position: relative;
                overflow: hidden;
                cursor: default;
                transition: transform .2s, box-shadow .2s
            }

            .s-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 12px 40px rgba(0, 0, 0, .18)
            }

            .s-card::after {
                content: "";
                position: absolute;
                right: -20px;
                bottom: -20px;
                width: 90px;
                height: 90px;
                border-radius: 50%;
                background: rgba(255, 255, 255, .08)
            }

            .s-card::before {
                content: "";
                position: absolute;
                right: 30px;
                bottom: 10px;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background: rgba(255, 255, 255, .06)
            }

            .s-card.total {
                background: var(--g-total)
            }

            .s-card.pending {
                background: var(--g-pending)
            }

            .s-card.approved {
                background: var(--g-approved)
            }

            .s-card.rejected {
                background: var(--g-rejected)
            }

            .s-icon {
                width: 40px;
                height: 40px;
                border-radius: 10px;
                background: rgba(255, 255, 255, .18);
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 14px
            }

            .s-label {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: .1em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, .7);
                margin-bottom: 6px
            }

            .s-value {
                font-size: 36px;
                font-weight: 800;
                color: #fff;
                font-family: 'DM Mono', monospace;
                line-height: 1
            }

            .s-sub {
                font-size: 12px;
                color: rgba(255, 255, 255, .55);
                margin-top: 6px
            }

            /* Toolbar */
            .toolbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
                gap: 12px;
                flex-wrap: wrap
            }

            .toolbar-left {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                flex: 1
            }

            .search-wrap {
                position: relative;
                flex: 1;
                min-width: 200px
            }

            .search-wrap svg {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                pointer-events: none;
                opacity: .45
            }

            .search-wrap input {
                width: 100%;
                padding: 10px 14px 10px 38px;
                border: 1.5px solid var(--border);
                border-radius: 10px;
                font-family: 'Sora', sans-serif;
                font-size: 13px;
                background: #fff;
                outline: none;
                transition: border .2s
            }

            .search-wrap input:focus {
                border-color: var(--navy)
            }

            select.flt {
                padding: 10px 14px;
                border: 1.5px solid var(--border);
                border-radius: 10px;
                font-family: 'Sora', sans-serif;
                font-size: 13px;
                background: #fff;
                outline: none;
                cursor: pointer;
                color: var(--text)
            }

            .toggle-wrap {
                display: flex;
                background: #fff;
                border: 1.5px solid var(--border);
                border-radius: 10px;
                overflow: hidden
            }

            .tog-btn {
                padding: 8px 14px;
                background: none;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                color: var(--muted);
                transition: all .18s
            }

            .tog-btn.active {
                background: var(--navy);
                color: #fff
            }

            .new-btn {
                background: var(--navy);
                color: #fff;
                padding: 10px 20px;
                border-radius: 10px;
                font-size: 13px;
                font-weight: 600;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                white-space: nowrap;
                transition: background .18s
            }

            .new-btn:hover {
                background: #091755
            }

            /* ── LIST VIEW ── */
            .list-view {
                display: flex;
                flex-direction: column;
                gap: 10px
            }

            .list-item {
                background: #fff;
                border: 1.5px solid var(--border);
                border-radius: 14px;
                padding: 16px 20px;
                display: grid;
                grid-template-columns: 140px 1fr auto auto auto;
                align-items: center;
                gap: 16px;
                transition: all .18s;
                cursor: default
            }

            .list-item:hover {
                border-color: var(--navy);
                box-shadow: 0 4px 20px rgba(4, 13, 51, .08);
                transform: translateX(3px)
            }

            .li-sl {
                font-family: 'DM Mono', monospace;
                font-size: 12px;
                font-weight: 500;
                color: var(--navy)
            }

            .li-meta {
                display: flex;
                flex-direction: column;
                gap: 3px
            }

            .li-date {
                font-size: 12px;
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 5px
            }

            .li-items {
                font-size: 11px;
                color: var(--muted);
                background: var(--light);
                padding: 2px 8px;
                border-radius: 6px;
                display: inline-block;
                margin-top: 2px
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 5px 12px;
                border-radius: 20px;
                font-size: 11px;
                font-weight: 600;
                font-family: 'DM Mono', monospace;
                white-space: nowrap
            }

            .badge.high {
                background: #fef2f2;
                color: #dc2626;
                border: 1px solid #fecaca
            }

            .badge.medium {
                background: #fffbeb;
                color: #d97706;
                border: 1px solid #fde68a
            }

            .badge.low {
                background: #f0fdf4;
                color: #059669;
                border: 1px solid #bbf7d0
            }

            .badge.pending {
                background: #fffbeb;
                color: #d97706;
                border: 1px solid #fde68a
            }

            .badge.approved {
                background: #f0fdf4;
                color: #059669;
                border: 1px solid #bbf7d0
            }

            .badge.rejected {
                background: #fef2f2;
                color: #dc2626;
                border: 1px solid #fecaca
            }

            .view-btn {
                background: var(--navy);
                color: #fff;
                padding: 8px 18px;
                border-radius: 8px;
                font-size: 12px;
                font-weight: 600;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: all .18s;
                white-space: nowrap
            }

            .view-btn:hover {
                background: #091755;
                gap: 10px
            }

            /* ── CARD VIEW ── */
            .card-view {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 18px
            }

            .req-card {
                background: #fff;
                border: 1.5px solid var(--border);
                border-radius: 18px;
                overflow: hidden;
                transition: all .2s;
                cursor: default
            }

            .req-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 40px rgba(4, 13, 51, .1);
                border-color: transparent
            }

            .card-top {
                padding: 18px 20px 14px;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: flex-start
            }

            .card-sl {
                font-family: 'DM Mono', monospace;
                font-size: 12px;
                font-weight: 500;
                color: var(--navy)
            }

            .card-body {
                padding: 16px 20px
            }

            .card-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px
            }

            .card-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .07em;
                color: var(--muted)
            }

            .card-val {
                font-size: 13px;
                font-weight: 600;
                color: var(--text)
            }

            .card-footer {
                padding: 14px 20px;
                background: #fafbff;
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center
            }

            .items-chip {
                font-size: 12px;
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 5px
            }

            /* Accent left border on card based on status */
            .req-card.pending {
                border-left: 4px solid #f59e0b
            }

            .req-card.approved {
                border-left: 4px solid #10b981
            }

            .req-card.rejected {
                border-left: 4px solid #ef4444
            }

            /* empty */
            .empty {
                text-align: center;
                padding: 60px;
                color: var(--muted)
            }

            /* Pagination */
            .pagination {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 24px;
                flex-wrap: wrap;
                gap: 12px
            }

            .page-info {
                font-size: 12px;
                color: var(--muted);
                font-family: 'DM Mono', monospace
            }

            .page-btns {
                display: flex;
                gap: 6px
            }

            .page-btns button {
                padding: 7px 13px;
                border: 1.5px solid var(--border);
                background: #fff;
                border-radius: 8px;
                font-size: 12px;
                font-family: 'Sora', sans-serif;
                color: var(--navy);
                cursor: pointer;
                font-weight: 600;
                transition: all .15s
            }

            .page-btns button:hover,
            .page-btns button.active {
                background: var(--navy);
                color: #fff;
                border-color: var(--navy)
            }

            .page-btns button:disabled {
                opacity: .4;
                cursor: not-allowed
            }

            /* hidden */
            .hidden {
                display: none !important
            }

            footer {
                background: var(--navy);
                padding: 18px 0;
                margin-top: auto
            }

            .footer-wrap {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px
            }

            .footer-wrap p {
                font-size: 12px;
                color: rgba(255, 255, 255, .4)
            }

            .footer-wrap a {
                color: #f59e0b;
                text-decoration: none
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(14px)
                }

                to {
                    opacity: 1;
                    transform: translateY(0)
                }
            }

            .s-card {
                animation: fadeUp .4s both
            }

            .s-card:nth-child(1) {
                animation-delay: .05s
            }

            .s-card:nth-child(2) {
                animation-delay: .1s
            }

            .s-card:nth-child(3) {
                animation-delay: .15s
            }

            .s-card:nth-child(4) {
                animation-delay: .2s
            }

            @media(max-width:760px) {
                .summary-grid {
                    grid-template-columns: repeat(2, 1fr)
                }

                .list-item {
                    grid-template-columns: 1fr auto;
                    gap: 10px
                }

                .li-meta,
                .badge.priority-badge {
                    display: none
                }
            }
        </style>
    </head>

    <body>

        <nav>
            <div class="container">
                <div class="nav-inner">
                    <div class="nav-brand">DAILY<span>STAR</span></div>
                    <div class="nav-right">
                        <span class="nav-pill">HISTORY</span>
                        <div class="nav-avatar">FH</div>
                    </div>
                </div>
            </div>
        </nav>

        <main>
            <div class="container">

                <!-- Summary -->
                <div class="summary-grid" id="summaryGrid"></div>

                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="search-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input type="text" id="search" placeholder="Search SL number…">
                        </div>
                        <select class="flt" id="prioFlt">
                            <option value="">All Priorities</option>
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                        </select>
                        <select class="flt" id="statusFlt">
                            <option value="">All Statuses</option>
                            <option>Pending</option>
                            <option>Approved</option>
                            <option>Rejected</option>
                        </select>
                    </div>
                    <div style="display:flex;gap:10px;align-items:center">
                        <div class="toggle-wrap">
                            <button class="tog-btn active" id="listToggle" title="List view" onclick="setView('list')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="8" y1="6" x2="21" y2="6" />
                                    <line x1="8" y1="12" x2="21" y2="12" />
                                    <line x1="8" y1="18" x2="21" y2="18" />
                                    <line x1="3" y1="6" x2="3.01" y2="6" />
                                    <line x1="3" y1="12" x2="3.01" y2="12" />
                                    <line x1="3" y1="18" x2="3.01" y2="18" />
                                </svg>
                            </button>
                            <button class="tog-btn" id="cardToggle" title="Card view" onclick="setView('card')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7" />
                                    <rect x="14" y="3" width="7" height="7" />
                                    <rect x="3" y="14" width="7" height="7" />
                                    <rect x="14" y="14" width="7" height="7" />
                                </svg>
                            </button>
                        </div>
                        <button class="new-btn" onclick="location.href='index.html'">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                            New Requisition
                        </button>
                    </div>
                </div>

                <!-- List View -->
                <div id="listView" class="list-view"></div>
                <!-- Card View -->
                <div id="cardView" class="card-view hidden"></div>

                <!-- Pagination -->
                <div class="pagination">
                    <div class="page-info" id="pageInfo"></div>
                    <div class="page-btns" id="pageBtns"></div>
                </div>
            </div>
        </main>

        <footer>
            <div class="container">
                <div class="footer-wrap">
                    <p>Requisition Management System</p>
                    <p>&copy; 2026 <a href="#">Xsellence Bangladesh Ltd</a>. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script>
            const data = [
                { sl: "REQ-2026-00847", date: "2026-05-19", priority: "High", status: "Pending", items: 3 },
                { sl: "REQ-2026-00831", date: "2026-05-15", priority: "Medium", status: "Approved", items: 5 },
                { sl: "REQ-2026-00819", date: "2026-05-10", priority: "Low", status: "Approved", items: 2 },
                { sl: "REQ-2026-00804", date: "2026-05-07", priority: "High", status: "Rejected", items: 4 },
                { sl: "REQ-2026-00791", date: "2026-05-03", priority: "Medium", status: "Approved", items: 6 },
                { sl: "REQ-2026-00775", date: "2026-04-28", priority: "Low", status: "Pending", items: 1 },
                { sl: "REQ-2026-00762", date: "2026-04-22", priority: "High", status: "Approved", items: 3 },
                { sl: "REQ-2026-00748", date: "2026-04-18", priority: "Medium", status: "Rejected", items: 2 },
                { sl: "REQ-2026-00733", date: "2026-04-12", priority: "Low", status: "Approved", items: 7 },
                { sl: "REQ-2026-00719", date: "2026-04-05", priority: "High", status: "Pending", items: 2 },
                { sl: "REQ-2026-00705", date: "2026-03-30", priority: "Medium", status: "Approved", items: 4 },
                { sl: "REQ-2026-00690", date: "2026-03-22", priority: "Low", status: "Rejected", items: 3 },
            ];

            const PER = 8;
            let page = 1, view = 'list', filtered = [...data];

            const icons = {
                total: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
                pending: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
                approved: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
                rejected: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
            };

            function renderSummary() {
                const t = data.length, p = data.filter(r => r.status === "Pending").length,
                    a = data.filter(r => r.status === "Approved").length, r = data.filter(r => r.status === "Rejected").length;
                document.getElementById("summaryGrid").innerHTML = `
    <div class="s-card total"><div class="s-icon">${icons.total}</div><div class="s-label">Total</div><div class="s-value">${String(t).padStart(2, "0")}</div><div class="s-sub">All requisitions</div></div>
    <div class="s-card pending"><div class="s-icon">${icons.pending}</div><div class="s-label">Pending</div><div class="s-value">${String(p).padStart(2, "0")}</div><div class="s-sub">Awaiting review</div></div>
    <div class="s-card approved"><div class="s-icon">${icons.approved}</div><div class="s-label">Approved</div><div class="s-value">${String(a).padStart(2, "0")}</div><div class="s-sub">Ready to dispatch</div></div>
    <div class="s-card rejected"><div class="s-icon">${icons.rejected}</div><div class="s-label">Rejected</div><div class="s-value">${String(r).padStart(2, "0")}</div><div class="s-sub">Not processed</div></div>
  `;
            }

            function pb(p) { const c = p.toLowerCase(); const d = p === "High" ? "🔴" : p === "Medium" ? "🟡" : "🟢"; return `<span class="badge ${c}">${d} ${p}</span>` }
            function sb(s) { const c = s.toLowerCase(); const d = s === "Pending" ? "⏳" : s === "Approved" ? "✅" : "❌"; return `<span class="badge ${c}">${d} ${s}</span>` }

            function renderList() {
                const start = (page - 1) * PER, slice = filtered.slice(start, start + PER);
                const lv = document.getElementById("listView"), cv = document.getElementById("cardView");
                if (!slice.length) {
                    lv.innerHTML = cv.innerHTML = `<div class="empty">No results found.</div>`;
                    document.getElementById("pageInfo").textContent = "";
                    document.getElementById("pageBtns").innerHTML = "";
                    return;
                }
                lv.innerHTML = slice.map((r, i) => `
    <div class="list-item" style="animation:fadeUp .3s ${i * .04}s both">
      <span class="li-sl">${r.sl}</span>
      <div class="li-meta">
        <span class="li-date"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${r.date}</span>
        <span class="li-items">${r.items} item${r.items !== 1 ? "s" : ""}</span>
      </div>
      ${pb(r.priority)}
      ${sb(r.status)}
      <a href="view.html?sl=${encodeURIComponent(r.sl)}" class="view-btn">View <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </div>
  `).join("");

                cv.innerHTML = slice.map((r, i) => `
    <div class="req-card ${r.status.toLowerCase()}" style="animation:fadeUp .3s ${i * .05}s both">
      <div class="card-top">
        <div><div class="card-sl">${r.sl}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${r.date}</div></div>
        ${sb(r.status)}
      </div>
      <div class="card-body">
        <div class="card-row"><span class="card-label">Priority</span>${pb(r.priority)}</div>
        <div class="card-row"><span class="card-label">Items</span><span class="card-val">${r.items} product${r.items !== 1 ? "s" : ""}</span></div>
      </div>
      <div class="card-footer">
        <span class="items-chip">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          ${r.items} items
        </span>
        <a href="view.html?sl=${encodeURIComponent(r.sl)}" class="view-btn">View Details →</a>
      </div>
    </div>
  `).join("");

                const total = filtered.length, tp = Math.ceil(total / PER);
                document.getElementById("pageInfo").textContent = `${start + 1}–${Math.min(start + PER, total)} of ${total}`;
                let b = `<button ${page === 1 ? "disabled" : ""} onclick="go(${page - 1})">‹</button>`;
                for (let i = 1; i <= tp; i++) b += `<button class="${i === page ? "active" : ""}" onclick="go(${i})">${i}</button>`;
                b += `<button ${page === tp ? "disabled" : ""} onclick="go(${page + 1})">›</button>`;
                document.getElementById("pageBtns").innerHTML = b;
            }

            function go(p) { page = p; renderList() }
            function setView(v) {
                view = v;
                document.getElementById("listView").classList.toggle("hidden", v !== "list");
                document.getElementById("cardView").classList.toggle("hidden", v !== "card");
                document.getElementById("listToggle").classList.toggle("active", v === "list");
                document.getElementById("cardToggle").classList.toggle("active", v === "card");
            }
            function applyFilter() {
                const s = document.getElementById("search").value.toLowerCase();
                const p = document.getElementById("prioFlt").value;
                const st = document.getElementById("statusFlt").value;
                filtered = data.filter(r => (!s || r.sl.toLowerCase().includes(s)) && (!p || r.priority === p) && (!st || r.status === st));
                page = 1; renderList();
            }
            document.getElementById("search").addEventListener("input", applyFilter);
            document.getElementById("prioFlt").addEventListener("change", applyFilter);
            document.getElementById("statusFlt").addEventListener("change", applyFilter);

            renderSummary(); renderList();
        </script>
    </body>
