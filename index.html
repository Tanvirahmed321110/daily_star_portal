<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Requisition Portal</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!--==================  Portal Header Here  ====================-->
        <header class="nav">
            <div class="container">
                <div class="header-wrap">
                    <div class="nav-logo">DAILY<span> STAR</span></div>
                    <div class="nav-right">
                        <span class="nav-badge">REQUISITION </span>
                        <div class="avater-name">
                            FH</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="page">

            <!-- MAIN CONTENT -->
            <main class="main">
                <div class="container">
                    <div class="page-header">
                        <div>
                            <div class="page-title">New <span>Purchase Requisition</span></div>
                        </div>
                    </div>

                    <!--==================||  User Information Here  ||====================-->
                    <div class="user-card">
                        <div class="user-avatar">
                            <img src="https://lh3.googleusercontent.com/a/ACg8ocLiFW0fYS0vL3mAnqt2sQMgamQjc5RYvbjADXkbHQHgW0VXriJi=s192-c-mo"
                                alt="user">
                        </div>
                        <div class="user-details">
                            <div class="user-field"><label>Full Name</label>
                                <div class="value">Fahim Hossain</div>
                            </div>
                            <div class="user-field"><label>Designation</label>
                                <div class="value">Sr. Engineer</div>
                            </div>
                            <div class="user-field"><label>Department</label>
                                <div class="value">Operations</div>
                            </div>
                            <div class="user-field"><label>HR ID</label>
                                <div class="value id">HR-2024-0142</div>
                            </div>
                        </div>
                    </div>

                    <!--==================||  Main Form Here  ||====================-->
                    <form action="#" class="form-card">
                        <div class="form-top">
                            <div class="field-group">
                                <label>SL Number</label>
                                <div class="sl-badge">REQ-2026-00847</div>
                            </div>
                            <div class="field-group">
                                <label>Date</label>
                                <input type="date" value="2026-05-05" readonly>
                            </div>
                            <div class="field-group">
                                <label>Priority</label>
                                <div class="priority-group">
                                    <div class="priority-btn high ">🔴 High</div>
                                    <div class="priority-btn medium">🟡 Medium</div>
                                    <div class="priority-btn low">🟢 Low</div>
                                </div>
                            </div>
                        </div>

                        <!-- PRODUCT SECTION -->
                        <div class="section-title">Products Lines</div>
                        <table class="product-table">
                            <thead>
                                <tr>
                                    <th style="width:40px">#</th>
                                    <th style="width:220px">Product </th>
                                    <th style="width:200px">Product Name</th>
                                    <th style="width:90px">Qty</th>
                                    <th style="width:130px">Required On</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;">01
                                    </td>
                                    <td>
                                        <select>
                                            <option>Select product...</option>
                                            <option selected>HP LaserJet Toner</option>
                                            <option>Wireless Keyboard</option>
                                            <option>USB-C Hub</option>
                                            <option>Monitor Stand</option>
                                        </select>
                                    </td>
                                    <td><input type="text" placeholder="Product Name"></td>
                                    <td><input type="number" value="2" min="1"></td>
                                    <td><input type="date" value="2026-05-05"></td>
                                    <td><input type="text" placeholder="Additional notes..."></td>
                                </tr>
                                <tr>
                                    <td style="color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;">02
                                    </td>
                                    <td>
                                        <select>
                                            <option>Select product...</option>
                                            <option>HP LaserJet Toner</option>
                                            <option selected>Wireless Keyboard</option>
                                            <option>USB-C Hub</option>
                                        </select>
                                    </td>
                                    <td><input type="text" placeholder="Product Name"></td>
                                    <td><input type="number" value="5" min="1"></td>
                                    <td><input type="date" value="2026-05-5"></td>
                                    <td><input type="text" placeholder="Additional notes..."></td>
                                </tr>
                            </tbody>
                        </table>
                        <button class="add-row-btn">+ Add Product Row</button>


                        <!--===========  Button Here  ============-->
                        <div class="form-actions">
                            <button class="btn btn-outline reset-btn">Reset</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                Submit Requisition
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg" style="margin-left: 8px;">
                                    <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white"
                                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>


        <!--=================|| Footer Here ||==================-->
        <footer>
            <div class="container">
                <div class="footer-wrap" style="display: flex;justify-content: space-between;flex-wrap: wrap;">
                    <p class="short-desc">Short Information</p>
                    <p>&copy; 2026 <a href="https://www.xsellencebdltd.com/">Xsellence Bangladesh Ltd</a>. All rights
                        reserved.
                    </p>
                </div>
            </div>
        </footer>

        <script>
            document.querySelectorAll('.priority-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    this.closest('.priority-group').querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            document.querySelector('.add-row-btn').addEventListener('click', function () {
                const tbody = document.querySelector('.product-table tbody');
                const rows = tbody.querySelectorAll('tr');
                const n = rows.length + 1;
                const row = rows[0].cloneNode(true);
                row.querySelector('td').textContent = String(n).padStart(2, '0');
                row.querySelectorAll('select')[0].selectedIndex = 0;
                row.querySelectorAll('input').forEach(i => { if (i.type === 'number') i.value = 1; else if (i.type !== 'date') i.value = ''; });
                tbody.appendChild(row);
            });
        </script>
    </body>

</html>
